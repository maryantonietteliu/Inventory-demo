<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.__pdfLibFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" onerror="window.__pdfLibFailed=true"></script>
<style>
  :root{
    --bg:#f3f0ea;
    --surface:#ffffff;
    --surface-2:#faf7f1;
    --border:#ddd5c6;
    --border-strong:#c9bda8;
    --text:#231e16;
    --text-muted:#75695a;
    --accent:#b3541e;
    --accent-strong:#8a3d13;
    --accent-soft:#f3e0cc;
    --accent-ink:#ffffff;
    --good:#2f7a4f;
    --good-soft:#e1efe5;
    --warn:#9c6c15;
    --warn-soft:#f7ecd3;
    --bad:#af3a35;
    --bad-soft:#f6e0dd;
    --shadow:0 1px 2px rgba(35,30,22,.06), 0 6px 20px -8px rgba(35,30,22,.18);
    --radius:10px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140f;
      --surface:#201b14;
      --surface-2:#251f17;
      --border:#3c3325;
      --border-strong:#4d422f;
      --text:#f1ebdf;
      --text-muted:#a99a83;
      --accent:#e08a44;
      --accent-strong:#f4a565;
      --accent-soft:#3a2614;
      --accent-ink:#20140a;
      --good:#5fbb8a;
      --good-soft:#1c2e22;
      --warn:#e2b64a;
      --warn-soft:#332912;
      --bad:#e2766f;
      --bad-soft:#35211e;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140f;
    --surface:#201b14;
    --surface-2:#251f17;
    --border:#3c3325;
    --border-strong:#4d422f;
    --text:#f1ebdf;
    --text-muted:#a99a83;
    --accent:#e08a44;
    --accent-strong:#f4a565;
    --accent-soft:#3a2614;
    --accent-ink:#20140a;
    --good:#5fbb8a;
    --good-soft:#1c2e22;
    --warn:#e2b64a;
    --warn-soft:#332912;
    --bad:#e2766f;
    --bad-soft:#35211e;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric: tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 22px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brand-mark{
    font-family:"Archivo",sans-serif; font-weight:900; font-size:21px;
    letter-spacing:.01em;
  }
  .brand-mark .dot{color:var(--accent);}
  .brand-sub{color:var(--text-muted); font-size:12.5px; letter-spacing:.03em; text-transform:uppercase;}
  .demo-badge{background:var(--accent); color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:3px 8px; border-radius:999px; align-self:center;}
  .search-wrap{position:relative; flex:1 1 260px; max-width:380px;}
  .search-wrap input{
    width:100%; padding:9px 12px 9px 34px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-size:14px; outline:none; transition:border-color .15s, background .15s;
  }
  .search-wrap input:focus{border-color:var(--accent); background:var(--surface);}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; width:15px; height:15px;}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius:999px; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text);
    padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
    transition:transform .08s ease, border-color .15s, background .15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  }
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{border-color:var(--border-strong); background:var(--surface-2);}
  .btn-danger{color:var(--bad);}
  .btn-danger:hover{border-color:var(--bad); background:var(--bad-soft);}
  .btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none;}
  .icon{width:15px; height:15px; flex:none; display:block;}

  .save-status{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted); padding:0 4px;}
  .save-dot{width:7px; height:7px; border-radius:50%; background:var(--border-strong); flex:none;}
  .save-status.saving .save-dot{background:var(--warn); animation:pulse 1s ease-in-out infinite;}
  .save-status.saved .save-dot{background:var(--good);}
  .save-status.error .save-dot{background:var(--bad);}
  .save-status.local .save-dot{background:var(--text-muted);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .banner{
    padding:9px 22px; font-size:13px; text-align:center;
    background:var(--warn-soft); color:var(--warn); border-bottom:1px solid var(--border);
  }
  .banner.readonly{background:var(--accent-soft); color:var(--accent-strong);}

  /* ---------- Stats ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(5,minmax(120px,1fr));
    gap:1px; background:var(--border);
    border-bottom:1px solid var(--border);
  }
  .stat{background:var(--surface); padding:14px 20px;}
  .stat-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px;}
  .stat-value{font-family:"Archivo",sans-serif; font-weight:800; font-size:24px;}
  .stat-value.good{color:var(--good);}
  .stat-value.warn{color:var(--warn);}
  .stat-value.bad{color:var(--bad);}
  .stat-clickable{
    border:none; margin:0; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    transition:background .15s;
  }
  .stat-clickable:hover{background:var(--surface-2);}
  .stat-clickable.active{background:var(--accent-soft);}
  .stat-clickable.active .stat-label{color:var(--accent-strong);}
  @media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr);} .stat:last-child{grid-column:1 / -1;} }

  /* ---------- Layout ---------- */
  .layout{flex:1; display:flex; align-items:flex-start; max-width:1320px; width:100%; margin:0 auto;}
  .sidebar{
    width:230px; flex:none; position:sticky; top:118px;
    max-height:calc(100vh - 130px); overflow-y:auto;
    padding:18px 10px 40px 22px;
  }
  .filter-group{display:flex; flex-direction:column; gap:2px; margin-bottom:18px;}
  .filter-chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 10px; border-radius:7px; border:1px solid transparent;
    background:transparent; color:var(--text-muted); font-size:13.5px; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .filter-chip:hover{background:var(--surface-2);}
  .filter-chip.active{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-soft);}
  .filter-chip .count{font-family:"IBM Plex Mono",monospace; font-size:11.5px; opacity:.8;}
  .cat-nav-title{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin:4px 4px 8px;}
  .cat-nav{display:flex; flex-direction:column; gap:1px;}
  .cat-nav a{
    display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:7px;
    text-decoration:none; color:var(--text); font-size:13.5px;
  }
  .cat-nav a:hover{background:var(--surface-2);}
  .cat-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--good);}
  .cat-dot.warn{background:var(--warn);}
  .cat-dot.bad{background:var(--bad);}
  .cat-nav-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cat-nav-count{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--text-muted);}

  .main{flex:1; min-width:0; padding:22px 24px 60px;}

  /* ---------- Category sections ---------- */
  .cat-section{margin-bottom:26px; scroll-margin-top:130px;}
  .cat-head{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:6px 4px; margin-bottom:10px; user-select:none;
  }
  .cat-head h2{
    font-family:"Archivo",sans-serif; font-weight:800; font-size:16.5px; margin:0;
    letter-spacing:.01em;
  }
  .cat-head .cat-count{font-family:"IBM Plex Mono",monospace; color:var(--text-muted); font-size:12.5px;}
  .cat-head .chev{width:13px; height:13px; color:var(--text-muted); transition:transform .15s; flex:none;}
  .cat-section.collapsed .chev{transform:rotate(-90deg);}
  .cat-head-line{flex:1; height:1px; background:var(--border);}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
  .cat-section.collapsed .table-wrap{display:none;}
  table{width:100%; border-collapse:collapse; min-width:0;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); font-weight:600; padding:8px 8px;
    border-bottom:1px solid var(--border); background:var(--surface-2);
    white-space:nowrap;
  }
  th.num, td.num{text-align:right;}
  .th-sortable{cursor:pointer; user-select:none;}
  .th-sortable:hover{color:var(--text);}
  .th-sortable.active{color:var(--accent-strong);}
  .sort-arrow{font-size:10px;}
  .sort-arrow.dim{opacity:.35;}
  tbody td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  tbody tr.dim{opacity:.4;}
  .item-name{font-weight:600;}
  .sku{color:var(--text-muted); font-size:12.5px;}
  .cell-input{
    width:64px; padding:5px 7px; border-radius:6px; border:1px solid transparent;
    background:transparent; color:var(--text); font-family:"IBM Plex Mono",monospace;
    font-size:13.5px; text-align:right; transition:border-color .15s, background .15s;
  }
  .cell-input:hover{border-color:var(--border);}
  .cell-input:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .cell-input.price{width:72px;}
  .cell-input.text{width:64px; text-align:left;}
  .unit-tag{color:var(--text-muted); font-size:12px; margin-left:5px;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px;
    border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.01em;
  }
  .pill::before{content:""; width:6px; height:6px; border-radius:50%;}
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.good::before{background:var(--good);}
  .pill.warn{background:var(--warn-soft); color:var(--warn);}
  .pill.warn::before{background:var(--warn);}
  .pill.bad{background:var(--bad-soft); color:var(--bad);}
  .pill.bad::before{background:var(--bad);}

  .row-actions{display:flex; gap:2px; justify-content:flex-end;}
  .icon-btn{
    width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid transparent; background:transparent; color:var(--text-muted);
    cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-2); color:var(--text); border-color:var(--border);}
  .icon-btn.danger:hover{color:var(--bad); background:var(--bad-soft); border-color:var(--bad-soft);}
  .icon-btn.good:hover{color:var(--good); background:var(--good-soft); border-color:var(--good-soft);}
  .icon-btn.bad:hover{color:var(--bad); background:var(--bad-soft); border-color:var(--bad-soft);}
  .icon-btn.count:hover{color:var(--accent); background:var(--accent-soft); border-color:var(--accent-soft);}
  .icon-btn.damage:hover{color:var(--warn); background:var(--warn-soft); border-color:var(--warn-soft);}

  .bulk-items-label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:6px;}
  .bulk-rows{display:flex; flex-direction:column; gap:8px;}
  .bulk-row{border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--surface-2);}
  .bulk-row-inputs{display:flex; gap:8px; align-items:center;}
  .bulk-row-inputs input[type="text"]{flex:1; min-width:0; padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px;}
  .bulk-row-inputs input[type="number"]{width:74px; padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px; font-family:"IBM Plex Mono",monospace;}
  .bulk-row-inputs input:focus{border-color:var(--accent); outline:none;}
  .bulk-row-hint{font-size:12px; color:var(--text-muted); margin-top:5px;}
  .bulk-row-hint.warn{color:var(--bad);}
  .bulk-sku-wrap{position:relative; flex:1; min-width:0;}
  .bulk-sku-wrap input[type="text"]{width:100%;}
  .bulk-suggest{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:60;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:4px; max-height:220px; overflow-y:auto;
  }
  .bulk-suggest-item{
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    width:100%; text-align:left; border:none; background:transparent;
    padding:7px 9px; border-radius:7px; cursor:pointer; font-family:inherit;
  }
  .bulk-suggest-item:hover, .bulk-suggest-item:focus{background:var(--surface-2);}
  .bulk-suggest-item .bs-name{font-size:13.5px; color:var(--text);}
  .bulk-suggest-item .bs-meta{font-size:11.5px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace;}

  .modal-item-preview{display:flex; align-items:flex-start; gap:12px;}
  .modal-item-preview h3{margin-top:0;}
  .value-text.good{color:var(--good);}
  .value-text.bad{color:var(--bad);}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-muted);}
  .empty-state h3{font-family:"Archivo",sans-serif; color:var(--text); margin:0 0 6px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,16,10,.45); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:8vh 20px 40px;
    z-index:100;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); width:100%; max-width:460px; padding:22px 24px 20px;
    max-height:85vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal.modal-lg{max-width:640px;}
  .modal h3{font-family:"Archivo",sans-serif; font-size:18px; margin:0 0 3px;}
  .modal .modal-sub{color:var(--text-muted); font-size:13px; margin:0 0 18px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface-2); color:var(--text); font-size:14px; outline:none;
  }
  .field input:focus{border-color:var(--accent); background:var(--surface);}
  .field input[type="checkbox"]{width:auto; padding:0; border-radius:3px; accent-color:var(--accent);}
  .field input:disabled{opacity:.55; cursor:not-allowed;}
  .field label.checkbox-row{display:flex; align-items:center; gap:7px; margin-top:8px; font-size:12.5px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-muted); cursor:pointer;}
  .field-hint{font-size:12px; color:var(--text-muted); margin:5px 0 0;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px;}
  .modal-actions .right{display:flex; gap:8px;}
  .confirm-box{
    margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--bad-soft);
    border:1px solid var(--bad); display:flex; flex-direction:column; gap:10px;
  }
  .confirm-box p{margin:0; font-size:13.5px; color:var(--text);}
  .confirm-box .row{display:flex; gap:8px; justify-content:flex-end;}

  /* ---------- Toast ---------- */
  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
    border-radius:10px; padding:11px 16px; font-size:13.5px; display:flex; align-items:center; gap:10px;
    max-width:320px;
  }
  .toast.err{border-color:var(--bad); color:var(--bad);}

  /* ---------- View toggle & export menu ---------- */
  .view-toggle{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px; gap:2px;}
  .view-btn{border:none; background:transparent; color:var(--text-muted); font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; font-family:inherit;}
  .view-btn.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
  .view-btn .count{font-family:"IBM Plex Mono",monospace; font-size:11px; opacity:.75; margin-left:5px;}

  .export-wrap{position:relative;}
  .export-menu{
    position:absolute; top:calc(100% + 6px); right:0; z-index:50;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); min-width:210px; padding:6px; display:flex; flex-direction:column; gap:2px;
  }
  .export-menu button{
    display:flex; align-items:center; gap:9px; text-align:left; border:none; background:transparent;
    color:var(--text); font-size:13.5px; padding:8px 10px; border-radius:7px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .export-menu button:hover{background:var(--surface-2);}
  .export-menu .icon{color:var(--text-muted); flex:none;}
  .export-group-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); padding:6px 10px 2px;}
  .export-divider{height:1px; background:var(--border); margin:4px 2px;}

  @media (max-width:820px){
    .layout{flex-direction:column;}
    .sidebar{
      position:static; width:100%; max-height:none; overflow-x:auto; overflow-y:visible;
      padding:14px 18px 0; display:flex; gap:18px; align-items:flex-start;
      -webkit-overflow-scrolling:touch;
    }
    .filter-group{flex-direction:row; margin-bottom:0; flex:none;}
    .cat-nav{display:none;}
    .cat-nav-title{display:none;}
    .main{padding:16px 18px 50px;}
  }

  /* ---------- Phone ---------- */
  @media (max-width:640px){
    body{font-size:14px;}
    .topbar{padding:10px 14px; gap:10px;}
    .brand{margin-right:0; flex:1 1 100%; order:1;}
    .brand-sub{display:none;}
    .search-wrap{order:3; flex:1 1 100%; max-width:none;}
    .view-toggle{order:4;}
    .export-wrap{order:5;}
    .auth-chip, .topbar > .btn-ghost{order:6;}
    .topbar > .btn-primary{order:2; margin-left:auto; padding:9px 13px;}
    .topbar > .btn-primary span{display:none;}
    .save-status{order:7;}

    .stats{grid-template-columns:repeat(2,1fr);}
    .stat{padding:12px 14px;}
    .stat-value{font-size:20px;}

    .main{padding:14px 12px 50px;}
    .cat-section{margin-bottom:20px;}

    .modal-backdrop{padding:16px; align-items:center;}
    .modal{max-width:none; width:100%; max-height:88vh; overflow-y:auto; padding:20px 18px;}
    .field-row{grid-template-columns:1fr;}

    .toast-wrap{left:14px; right:14px; bottom:14px;}
    .toast{max-width:none;}

    /* Card-style tables: header row hidden, each row becomes a compact card.
       The item name gets its own line; every other field is a small inline
       chip that wraps onto as few lines as will fit; actions get their own
       line at the bottom. */
    .table-wrap{border:none; box-shadow:none; background:transparent; overflow-x:visible;}
    table{min-width:0;}
    thead{display:none;}
    tbody{display:flex; flex-direction:column; gap:10px;}
    tr{
      display:flex; flex-wrap:wrap; align-items:center;
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    td{
      display:flex; align-items:baseline; gap:5px;
      padding:7px 10px; font-size:13px; white-space:nowrap;
    }
    td::before{
      content:attr(data-label); font-size:10px; font-weight:600; text-transform:uppercase;
      letter-spacing:.03em; color:var(--text-muted); flex:none;
    }
    td[data-label=""]::before{content:none;}
    td.item-name{
      flex:1 0 100%; font-size:15px; background:var(--surface-2);
      padding:10px 12px; border-bottom:1px solid var(--border);
    }
    td.item-name::before{content:none;}
    td[data-label=""]{
      flex:1 0 100%; border-top:1px solid var(--border); margin-top:2px; padding-top:8px;
    }
    td .row-actions{justify-content:flex-end; width:100%;}
    td .icon-btn{width:34px; height:34px;}
    td .cell-input, td input.cell-input{width:64px; text-align:right; padding:4px 6px; font-size:13px;}
    td .cell-input.text{width:110px;}

    /* Shorter cards on phones: drop the least essential columns */
    td[data-label="Unit"], td[data-label="Reorder pt."], td[data-label="Category"]{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .auth-chip{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted);}
  .auth-chip .auth-email{max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sync-loading{color:var(--text-muted); font-size:13px; display:flex; align-items:center; gap:6px;}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
